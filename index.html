
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas LMS</title>
  <style>
    body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    window.onerror = function(msg, url, line) {
      document.body.innerHTML = "<h2 style='color:red;padding:20px;'>Error on line " + line + ": " + msg + "</h2>";
    };

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth || 800;
      canvas.height = window.innerHeight || 600;
    }
    resize();
    window.addEventListener("resize", resize);

    function loadImg(src) {
      const img = new Image();
      img.broken = false;
      img.onerror = () => { img.broken = true; };
      img.src = src;
      return img;
    }

    const idleImg = loadImg("player.png");
    const walkImg = loadImg("player-walk-frame1.png");
    const biteFrames = [
      loadImg("player-bite-frame1.png"),
      loadImg("player-bite-frame2.png"),
      loadImg("player-bite-frame3.png")
    ];
    const enemyIdleImg = loadImg("enemy-idle.png");
    const enemyMoveImg = loadImg("enemy-move.png");
    const enemyAttackImg = loadImg("enemy-attack.png");
    const playBtnImg = loadImg("play-button.png");
    const controlsBtnImg = loadImg("controls-button.png");

    let gameState = "TITLE";
    let showControls = false;
    let wave = 1;
    let points = 0;

    let player = {
      x: 200, y: 200, width: 48, height: 48,
      speed: 2.5, facingLeft: false, hp: 20, maxHp: 20, biteCooldown: 0
    };

    let isBiting = false;
    let biteIndex = 0;
    let biteTimer = 0;
    let isMoving = false;
    let enemies = [];
    let keys = {};

    function getBtns() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      return {
        play: { x: cx - 100, y: cy - 70, w: 200, h: 55 },
        controls: { x: cx - 100, y: cy + 5, w: 200, h: 55 },
        heal: { x: cx - 130, y: cy - 30, w: 260, h: 50 },
        maxHp: { x: cx - 130, y: cy + 35, w: 260, h: 50 },
        next: { x: cx - 130, y: cy + 110, w: 260, h: 55 }
      };
    }

    function hit(mx, my, r) {
      return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
    }

    canvas.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const b = getBtns();

      if (gameState === "TITLE") {
        if (hit(mx, my, b.play)) {
          wave = 1; points = 0; player.maxHp = 20; player.hp = 20;
          player.x = canvas.width / 2 - 24; player.y = canvas.height / 2 - 24;
          isBiting = false; showControls = false; gameState = "PLAYING";
          spawnWave(1);
        } else if (hit(mx, my, b.controls)) {
          showControls = !showControls;
        }
      } else if (gameState === "SHOP") {
        if (hit(mx, my, b.heal) && points >= 3 && player.hp < player.maxHp) {
          points -= 3; player.hp = Math.min(player.maxHp, player.hp + 5);
        } else if (hit(mx, my, b.maxHp) && points >= 5) {
          points -= 5; player.maxHp += 3; player.hp += 3;
        } else if (hit(mx, my, b.next)) {
          wave++; gameState = "PLAYING"; spawnWave(wave);
        }
      }
    });

    function spawnWave(w) {
      enemies = [];
      const count = w * 5;
      for (let i = 0; i < count; i++) {
        enemies.push({
          x: Math.random() * Math.max(100, canvas.width - 48),
          y: Math.random() * Math.max(100, canvas.height - 48),
          width: 48,
          height: 48,
          speed: 1.3,
          hp: 1, // One bite kills the enemy
          state: "IDLE",
          facingLeft: false,
          attackCooldown: 0,
          attackAnimTimer: 0
        });
      }
    }

    window.addEventListener("keydown", e => {
      keys[e.key] = true;
      if (gameState === "PLAYING" && e.code === "Space" && !isBiting && player.biteCooldown <= 0) {
        e.preventDefault();
        isBiting = true;
        isMoving = false;
        biteIndex = 0;
        biteTimer = 0;
        player.biteCooldown = 1000;

        const px = player.x + 24;
        const py = player.y + 24;

        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          const ex = en.x + 24;
          const ey = en.y + 24;
          if (Math.hypot(ex - px, ey - py) <= 65) {
            en.hp -= 1;
            if (en.hp <= 0) {
              enemies.splice(i, 1); // Instant defeat in 1 bite
            }
          }
        }
      }
    });

    window.addEventListener("keyup", e => { keys[e.key] = false; });

    function canDraw(img) {
      return img && !img.broken && img.complete && img.naturalWidth > 0;
    }

    function drawBtn(r, label, img, col) {
      if (canDraw(img)) { ctx.drawImage(img, r.x, r.y, r.w, r.h); return; }
      ctx.fillStyle = col || "#222";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    }

    function drawSprite(img, x, y, w, h, left, col) {
      ctx.save();
      if (left) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        if (canDraw(img)) ctx.drawImage(img, 0, 0, w, h);
        else { ctx.fillStyle = col; ctx.fillRect(0, 0, w, h); }
      } else {
        if (canDraw(img)) ctx.drawImage(img, x, y, w, h);
        else { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
      }
      ctx.restore();
    }

    let last = 0;
    function loop(ts) {
      const dt = ts - last;
      last = ts;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const b = getBtns();

      if (gameState === "TITLE") {
        drawBtn(b.play, "Play", playBtnImg, "#222");
        drawBtn(b.controls, "Controls", controlsBtnImg, "#222");
        if (showControls) {
          ctx.fillStyle = "#eee";
          ctx.fillRect(canvas.width / 2 - 170, canvas.height / 2 + 80, 340, 80);
          ctx.fillStyle = "#222";
          ctx.font = "16px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Move: WASD / Arrows | Bite: Space (1s cooldown)", canvas.width / 2, canvas.height / 2 + 125);
        }
      } else if (gameState === "SHOP") {
        ctx.fillStyle = "#222"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("Wave " + wave + " Complete! (+" + wave + " Pts)", canvas.width / 2, canvas.height / 2 - 100);
        ctx.font = "18px sans-serif";
        ctx.fillText("HP: " + player.hp + "/" + player.maxHp + " | Points: " + points, canvas.width / 2, canvas.height / 2 - 65);
        drawBtn(b.heal, "Heal +5 HP (3 Pts)", null, points >= 3 && player.hp < player.maxHp ? "#222" : "#aaa");
        drawBtn(b.maxHp, "Max Health +3 (5 Pts)", null, points >= 5 ? "#222" : "#aaa");
        drawBtn(b.next, "Next Wave", null, "#0969da");
      } else {
        if (player.biteCooldown > 0) player.biteCooldown = Math.max(0, player.biteCooldown - dt);
        let moved = false;
        if (!isBiting) {
          if (keys["ArrowUp"] || keys["w"] || keys["W"]) { player.y -= player.speed; moved = true; }
          if (keys["ArrowDown"] || keys["s"] || keys["S"]) { player.y += player.speed; moved = true; }
          if (keys["ArrowLeft"] || keys["a"] || keys["A"]) { player.x -= player.speed; player.facingLeft = true; moved = true; }
          if (keys["ArrowRight"] || keys["d"] || keys["D"]) { player.x += player.speed; player.facingLeft = false; moved = true; }
        }
        isMoving = moved;
        player.x = Math.max(0, Math.min(canvas.width - 48, player.x));
        player.y = Math.max(0, Math.min(canvas.height - 48, player.y));

        if (isBiting) {
          biteTimer += dt;
          if (biteTimer >= 100) {
            biteTimer -= 100; biteIndex++;
            if (biteIndex >= 3) { biteIndex = 0; isBiting = false; }
          }
        }

        for (let en of enemies) {
          if (en.attackCooldown > 0) en.attackCooldown = Math.max(0, en.attackCooldown - dt);
          if (en.attackAnimTimer > 0) en.attackAnimTimer = Math.max(0, en.attackAnimTimer - dt);

          const dx = (player.x + 24) - (en.x + 24);
          const dy = (player.y + 24) - (en.y + 24);
          const dist = Math.hypot(dx, dy);

          // Turn enemy sprite left or right based on player position
          if (dx < -2) en.facingLeft = true;
          else if (dx > 2) en.facingLeft = false;

          if (dist <= 45) {
            if (en.attackCooldown <= 0) {
              en.state = "ATTACK";
              en.attackCooldown = 1200;
              en.attackAnimTimer = 300;
              player.hp -= 2;
              if (player.hp <= 0) {
                gameState = "TITLE";
                enemies = [];
                break;
              }
            } else if (en.attackAnimTimer <= 0) {
              en.state = "IDLE";
            }
          } else if (dist <= 360) {
            if (en.attackAnimTimer <= 0) en.state = "MOVE";
            en.x += (dx / dist) * en.speed;
            en.y += (dy / dist) * en.speed;
          } else if (en.attackAnimTimer <= 0) {
            en.state = "IDLE";
          }

          const eImg = en.state === "ATTACK" ? enemyAttackImg : (en.state === "MOVE" ? enemyMoveImg : enemyIdleImg);
          drawSprite(eImg, en.x, en.y, 48, 48, en.facingLeft, "#d9534f");
        }

        if (gameState === "PLAYING" && enemies.length === 0) {
          gameState = "SHOP";
          points += wave;
        }

        const pImg = isBiting ? biteFrames[biteIndex] : (isMoving ? walkImg : idleImg);
        drawSprite(pImg, player.x, player.y, 48, 48, player.facingLeft, "#333");

        ctx.fillStyle = "#222";
Use code with caution.
ctx.font = "bold 16px sans-serif";
ctx.textAlign = "left";
const biteText = player.biteCooldown > 0 ? "Bite: " + (player.biteCooldown / 1000).toFixed(1) + "s" : "Bite: Ready";
ctx.fillText("HP: " + player.hp + "/" + player.maxHp + "   |   Wave: " + wave + "   |   Pts: " + points + "   |   " + biteText, 20, 30);
}
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
