<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas LMS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    window.onerror = function(msg, url, line) {
      document.body.innerHTML = "<div style='color:red;font-size:20px;padding:20px;'>Error line " + line + ": " + msg + "</div>";
      return false;
    };

    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth || document.documentElement.clientWidth || 800;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || 600;
    }
    resize();
    window.addEventListener("resize", resize);

    function loadImg(src) {
      var img = new Image();
      img.broken = false;
      img.onerror = function() { img.broken = true; };
      img.src = src;
      return img;
    }

    var idleImg = loadImg("player.png");
    var walkImg = loadImg("player-walk-frame1.png");
    var biteFrames = [
      loadImg("player-bite-frame1.png"),
      loadImg("player-bite-frame2.png"),
      loadImg("player-bite-frame3.png")
    ];
    var enemyIdleImg = loadImg("enemy-idle.png");
    var enemyMoveImg = loadImg("enemy-move.png");
    var enemyAttackImg = loadImg("enemy-attack.png");
    var playBtnImg = loadImg("play-button.png");
    var controlsBtnImg = loadImg("controls-button.png");

    var gameState = "TITLE";
    var showControls = false;
    var wave = 1;
    var points = 0;

    var player = {
      x: 200,
      y: 200,
      width: 48,
      height: 48,
      speed: 2.5,
      facingLeft: false,
      hp: 20,
      maxHp: 20,
      biteCooldown: 0
    };

    var isBiting = false;
    var biteIndex = 0;
    var biteTimer = 0;
    var isMoving = false;
    var enemies = [];
    var keys = {};

    function getBtns() {
      var cx = canvas.width / 2;
      var cy = canvas.height / 2;
      return {
        play: { x: cx - 100, y: cy - 70, w: 200, h: 55 },
        controls: { x: cx - 100, y: cy + 5, w: 200, h: 55 },
        heal: { x: cx - 130, y: cy - 30, w: 260, h: 50 },
        maxHp: { x: cx - 130, y: cy + 35, w: 260, h: 50 },
        next: { x: cx - 130, y: cy + 110, w: 260, h: 55 }
      };
    }

    function hit(mx, my, r) {
      return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
    }

    canvas.addEventListener("mousedown", function(e) {
      if (e.button !== 0) return;
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      var b = getBtns();

      if (gameState === "TITLE") {
        if (hit(mx, my, b.play)) {
          wave = 1;
          points = 0;
          player.maxHp = 20;
          player.hp = 20;
          player.biteCooldown = 0;
          player.x = canvas.width / 2 - 24;
          player.y = canvas.height / 2 - 24;
          isBiting = false;
          showControls = false;
          gameState = "PLAYING";
          spawnWave(1);
        } else if (hit(mx, my, b.controls)) {
          showControls = !showControls;
        }
      } else if (gameState === "SHOP") {
        if (hit(mx, my, b.heal) && points >= 3 && player.hp < player.maxHp) {
          points -= 3;
          player.hp = Math.min(player.maxHp, player.hp + 5);
        } else if (hit(mx, my, b.maxHp) && points >= 5) {
          points -= 5;
          player.maxHp += 3;
          player.hp += 3;
        } else if (hit(mx, my, b.next)) {
          wave++;
          gameState = "PLAYING";
          spawnWave(wave);
        }
      }
    });

    function spawnWave(w) {
      enemies = [];
      var count = w * 5;
      var maxW = Math.max(100, canvas.width - 48);
      var maxH = Math.max(100, canvas.height - 48);

      for (var i = 0; i < count; i++) {
        var ex = Math.random() * maxW;
        var ey = Math.random() * maxH;
        var tries = 0;
        while (Math.hypot(ex - player.x, ey - player.y) < 140 && tries < 15) {
          ex = Math.random() * maxW;
          ey = Math.random() * maxH;
          tries++;
        }
        enemies.push({
          x: ex,
          y: ey,
          width: 48,
          height: 48,
          speed: 1.3,
          hp: 1,
          state: "IDLE",
          facingLeft: false,
          attackCooldown: 0,
          attackAnimTimer: 0
        });
      }
    }

    window.addEventListener("keydown", function(e) {
      keys[e.key] = true;
      if (gameState === "PLAYING" && e.code === "Space" && !isBiting && player.biteCooldown <= 0) {
        e.preventDefault();
        isBiting = true;
        isMoving = false;
        biteIndex = 0;
        biteTimer = 0;
        player.biteCooldown = 1000;

        var px = player.x + 24;
        var py = player.y + 24;
        for (var i = enemies.length - 1; i >= 0; i--) {
          var en = enemies[i];
          var ex = en.x + 24;
          var ey = en.y + 24;
          if (Math.hypot(ex - px, ey - py) <= 65) {
            enemies.splice(i, 1);
          }
        }
      }
    });

    window.addEventListener("keyup", function(e) {
      keys[e.key] = false;
    });

    function canDraw(img) {
      return img && !img.broken && img.complete && img.naturalWidth > 0;
    }

    function drawBtn(r, label, img, col) {
      if (canDraw(img)) {
        ctx.drawImage(img, r.x, r.y, r.w, r.h);
        return;
      }
      ctx.fillStyle = col || "#222222";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 20px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    }

    function drawSprite(img, x, y, w, h, left, col) {
      ctx.save();
      if (left) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        if (canDraw(img)) {
          ctx.drawImage(img, 0, 0, w, h);
        } else {
          ctx.fillStyle = col;
          ctx.fillRect(0, 0, w, h);
        }
      } else {
        if (canDraw(img)) {
          ctx.drawImage(img, x, y, w, h);
        } else {
          ctx.fillStyle = col;
          ctx.fillRect(x, y, w, h);
        }
      }
      ctx.restore();
    }

    var last = 0;
    function loop(ts) {
      if (!last) last = ts;
      var dt = ts - last;
      last = ts;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var b = getBtns();

      if (gameState === "TITLE") {
        drawBtn(b.play, "Play", playBtnImg, "#222222");
        drawBtn(b.controls, "Controls", controlsBtnImg, "#222222");
        if (showControls) {
          ctx.fillStyle = "#eeeeee";
          ctx.fillRect(canvas.width / 2 - 180, canvas.height / 2 + 80, 360, 80);
          ctx.fillStyle = "#222222";
          ctx.font = "16px Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Move: WASD / Arrows | Bite: Space (1s cooldown)", canvas.width / 2, canvas.height / 2 + 120);
        }
      } else if (gameState === "SHOP") {
        ctx.fillStyle = "#222222";
        ctx.font = "bold 26px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("Wave " + wave + " Complete! (+" + wave + " Pts)", canvas.width / 2, canvas.height / 2 - 100);
        ctx.font = "18px Arial, sans-serif";
        ctx.fillText("HP: " + player.hp + "/" + player.maxHp + " | Points: " + points, canvas.width / 2, canvas.height / 2 - 65);
        drawBtn(b.heal, "Heal +5 HP (3 Pts)", null, points >= 3 && player.hp < player.maxHp ? "#222222" : "#aaaaaa");
        drawBtn(b.maxHp, "Max Health +3 (5 Pts)", null, points >= 5 ? "#222222" : "#aaaaaa");
        drawBtn(b.next, "Next Wave", null, "#0969da");
      } else {
        if (player.biteCooldown > 0) player.biteCooldown = Math.max(0, player.biteCooldown - dt);
        var moved = false;
        if (!isBiting) {
          if (keys["ArrowUp"] || keys["w"] || keys["W"]) { player.y -= player.speed; moved = true; }
          if (keys["ArrowDown"] || keys["s"] || keys["S"]) { player.y += player.speed; moved = true; }
          if (keys["ArrowLeft"] || keys["a"] || keys["A"]) { player.x -= player.speed; player.facingLeft = true; moved = true; }
          if (keys["ArrowRight"] || keys["d"] || keys["D"]) { player.x += player.speed; player.facingLeft = false; moved = true; }
        }
        isMoving = moved;
        player.x = Math.max(0, Math.min(canvas.width - 48, player.x));
        player.y = Math.max(0, Math.min(canvas.height - 48, player.y));

        if (isBiting) {
          biteTimer += dt;
          if (biteTimer >= 100) {
            biteTimer -= 100;
            biteIndex++;
            if (biteIndex >= 3) {
              biteIndex = 0;
              isBiting = false;
            }
          }
        }

        for (var i = 0; i < enemies.length; i++) {
          var en = enemies[i];
          if (en.attackCooldown > 0) en.attackCooldown = Math.max(0, en.attackCooldown - dt);
          if (en.attackAnimTimer > 0) en.attackAnimTimer = Math.max(0, en.attackAnimTimer - dt);

          var dx = (player.x + 24) - (en.x + 24);
          var dy = (player.y + 24) - (en.y + 24);
          var dist = Math.hypot(dx, dy);

          if (dx < -2) en.facingLeft = true;
          else if (dx > 2) en.facingLeft = false;

          if (dist <= 45) {
            if (en.attackCooldown <= 0) {
              en.state = "ATTACK";
              en.attackCooldown = 1200;
              en.attackAnimTimer = 300;
              player.hp -= 2;
              if (player.hp <= 0) {
                gameState = "TITLE";
                enemies = [];
                break;
              }
Use code with caution.
} else if (en.attackAnimTimer <= 0) {
en.state = "IDLE";
}
} else if (dist <= 360) {
if (en.attackAnimTimer <= 0) en.state = "MOVE";
en.x += (dx / dist) * en.speed;
en.y += (dy / dist) * en.speed;
} else if (en.attackAnimTimer <= 0) {
en.state = "IDLE";
}
var eImg = en.state === "ATTACK" ? enemyAttackImg : (en.state === "MOVE" ? enemyMoveImg : enemyIdleImg);
drawSprite(eImg, en.x, en.y, 48, 48, en.facingLeft, "#d9534f");
}
if (gameState === "PLAYING" && enemies.length === 0) {
gameState = "SHOP";
points += wave;
}
var pImg = isBiting ? biteFrames[biteIndex] : (isMoving ? walkImg : idleImg);
drawSprite(pImg, player.x, player.y, 48, 48, player.facingLeft, "#333333");
ctx.fillStyle = "#222222";
ctx.font = "bold 16px Arial, sans-serif";
ctx.textAlign = "left";
ctx.textBaseline = "alphabetic";
var biteText = player.biteCooldown > 0 ? "Bite: " + (player.biteCooldown / 1000).toFixed(1) + "s" : "Bite: Ready";
ctx.fillText("HP: " + player.hp + "/" + player.maxHp + "   |   Wave: " + wave + "   |   Pts: " + points + "   |   " + biteText, 20, 30);
}
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
