<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas LMS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // 1. Load idle, single walk sprite, and bite frames
    function loadImg(src) {
      const img = new Image();
      img.src = src;
      return img;
    }

    const idleImg = loadImg("player.png");
    const walkImg = loadImg("player-walk-frame1.png");
    const biteFrames = [
      loadImg("player-bite-frame1.png"),
      loadImg("player-bite-frame2.png"),
      loadImg("player-bite-frame3.png")
    ];

    // 2. Player & Animation settings
    let player = {
      x: canvas.width / 2 - 24,
      y: canvas.height / 2 - 24,
      width: 48,
      height: 48,
      speed: 2.5,
      facingLeft: false
    };

    let isBiting = false;
    let biteIndex = 0;
    let biteTimer = 0;
    let isMoving = false;

    const fps = 10;
    const frameInterval = 1000 / fps; // 100ms per frame (10 FPS)

    let keys = {};

    // 3. Keyboard controls
    window.addEventListener("keydown", e => {
      keys[e.key] = true;

      if (e.code === "Space" && !isBiting) {
        e.preventDefault();
        isBiting = true;
        isMoving = false; // Stop walking state immediately
        biteIndex = 0;
        biteTimer = 0;
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    // 4. Update movement, direction, and bite animation timing
    function update(deltaTime) {
      let moved = false;

      // Only allow movement when NOT biting
      if (!isBiting) {
        if (keys["ArrowUp"] || keys["w"] || keys["W"]) {
          player.y -= player.speed;
          moved = true;
        }
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) {
          player.y += player.speed;
          moved = true;
        }
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
          player.x -= player.speed;
          player.facingLeft = true;
          moved = true;
        }
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
          player.x += player.speed;
          player.facingLeft = false;
          moved = true;
        }
      }

      isMoving = moved;

      // Keep player inside the full screen edges
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

      // 10 FPS Bite Animation
      if (isBiting) {
        biteTimer += deltaTime;
        if (biteTimer >= frameInterval) {
          biteTimer -= frameInterval;
          biteIndex++;

          if (biteIndex >= biteFrames.length) {
            biteIndex = 0;
            isBiting = false;
          }
        }
      }
    }

    // 5. Draw everything (with horizontal flip support)
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let activeImg = idleImg;
      if (isBiting) {
        activeImg = biteFrames[biteIndex];
      } else if (isMoving) {
        activeImg = walkImg;
      }

      ctx.save();

      if (player.facingLeft) {
        ctx.translate(player.x + player.width, player.y);
        ctx.scale(-1, 1);

        if (activeImg.complete && activeImg.naturalWidth !== 0) {
          ctx.drawImage(activeImg, 0, 0, player.width, player.height);
        } else {
          ctx.fillStyle = "#333";
          ctx.fillRect(0, 0, player.width, player.height);
        }
      } else {
        if (activeImg.complete && activeImg.naturalWidth !== 0) {
          ctx.drawImage(activeImg, player.x, player.y, player.width, player.height);
        } else {
          ctx.fillStyle = "#333";
          ctx.fillRect(player.x, player.y, player.width, player.height);
        }
      }

      ctx.restore();
    }

    // 6. Main game loop
    let lastTime = 0;
    function loop(timestamp) {
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      update(deltaTime);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
