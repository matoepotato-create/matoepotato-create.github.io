<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Canvas LMS</title>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; user-select: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
function resize() { c.width = innerWidth; c.height = innerHeight; }
resize(); onresize = resize;

const img = s => { const i = new Image(); i.onerror = () => i.bad = 1; i.src = s; return i; };
const pIdle = img("player.png"), pWalk = img("player-walk-frame1.png");
const pBite = [img("player-bite-frame1.png"), img("player-bite-frame2.png"), img("player-bite-frame3.png")];
const eIdle = img("enemy-idle.png"), eMove = img("enemy-move.png"), eAtk = img("enemy-attack.png");
const btnPlay = img("play-button.png"), btnCtrl = img("controls-button.png");

let state = "TITLE", showCtrl = false, wave = 1, pts = 0, enemies = [], keys = {};
let p = { x: 0, y: 0, w: 48, h: 48, spd: 2.5, left: false, hp: 20, max: 20, cd: 0, biting: false, bIdx: 0, bT: 0, moving: false };

const btns = () => {
  const cx = c.width / 2, cy = c.height / 2;
  return {
    play: { x: cx - 100, y: cy - 70, w: 200, h: 55 },
    ctrl: { x: cx - 100, y: cy + 5, w: 200, h: 55 },
    heal: { x: cx - 130, y: cy - 30, w: 260, h: 50 },
    max:  { x: cx - 130, y: cy + 35, w: 260, h: 50 },
    next: { x: cx - 130, y: cy + 110, w: 260, h: 55 }
  };
};
const hit = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function spawnWave(w) {
  enemies = [];
  for (let i = 0; i < w * 5; i++) {
    let ex, ey, t = 0;
    do { ex = Math.random() * Math.max(50, c.width - 48); ey = Math.random() * Math.max(50, c.height - 48); t++; }
    while (Math.hypot(ex - p.x, ey - p.y) < 140 && t < 15);
    enemies.push({ x: ex, y: ey, spd: 1.3, st: "IDLE", left: false, cd: 0, anim: 0 });
  }
}

c.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const r = c.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, b = btns();
  if (state === "TITLE") {
    if (hit(mx, my, b.play)) {
      wave = 1; pts = 0; p.max = 20; p.hp = 20; p.cd = 0; p.biting = false; showCtrl = false;
      p.x = c.width / 2 - 24; p.y = c.height / 2 - 24; state = "PLAY"; spawnWave(1);
    } else if (hit(mx, my, b.ctrl)) showCtrl = !showCtrl;
  } else if (state === "SHOP") {
    if (hit(mx, my, b.heal) && pts >= 3 && p.hp < p.max) { pts -= 3; p.hp = Math.min(p.max, p.hp + 5); }
    else if (hit(mx, my, b.max) && pts >= 5) { pts -= 5; p.max += 3; p.hp += 3; }
    else if (hit(mx, my, b.next)) { wave++; state = "PLAY"; spawnWave(wave); }
  }
});

onkeydown = e => {
  keys[e.key] = true;
  if (state === "PLAY" && e.code === "Space" && !p.biting && p.cd <= 0) {
    e.preventDefault(); p.biting = true; p.moving = false; p.bIdx = 0; p.bT = 0; p.cd = 1000;
    enemies = enemies.filter(en => Math.hypot((en.x + 24) - (p.x + 24), (en.y + 24) - (p.y + 24)) > 65);
  }
};
onkeyup = e => keys[e.key] = false;

const ok = i => i && !i.bad && i.complete && i.naturalWidth > 0;
function drawBtn(r, txt, im, col) {
  if (ok(im)) return ctx.drawImage(im, r.x, r.y, r.w, r.h);
  ctx.fillStyle = col || "#222"; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(txt, r.x + r.w / 2, r.y + r.h / 2);
}
function drawSpr(im, x, y, left, col) {
  ctx.save();
  if (left) { ctx.translate(x + 48, y); ctx.scale(-1, 1); x = 0; y = 0; }
  if (ok(im)) ctx.drawImage(im, x, y, 48, 48); else { ctx.fillStyle = col; ctx.fillRect(x, y, 48, 48); }
  ctx.restore();
}

let last = 0;
function loop(ts) {
  const dt = last ? ts - last : 0; last = ts;
  ctx.clearRect(0, 0, c.width, c.height);
  const b = btns();

  if (state === "TITLE") {
    drawBtn(b.play, "Play", btnPlay); drawBtn(b.ctrl, "Controls", btnCtrl);
    if (showCtrl) {
      ctx.fillStyle = "#eee"; ctx.fillRect(c.width / 2 - 180, c.height / 2 + 80, 360, 70);
      ctx.fillStyle = "#222"; ctx.font = "16px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("Move: WASD / Arrows | Bite: Space (1s cooldown)", c.width / 2, c.height / 2 + 120);
    }
  } else if (state === "SHOP") {
    ctx.fillStyle = "#222"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`Wave ${wave} Complete! (+${wave} Pts)`, c.width / 2, c.height / 2 - 100);
    ctx.font = "18px sans-serif";
    ctx.fillText(`HP: ${p.hp}/${p.max} | Points: ${pts}`, c.width / 2, c.height / 2 - 65);
    drawBtn(b.heal, "Heal +5 HP (3 Pts)", null, pts >= 3 && p.hp < p.max ? "#222" : "#aaa");
    drawBtn(b.max, "Max Health +3 (5 Pts)", null, pts >= 5 ? "#222" : "#aaa");
    drawBtn(b.next, "Next Wave", null, "#0969da");
  } else {
    if (p.cd > 0) p.cd = Math.max(0, p.cd - dt);
    let mv = false;
    if (!p.biting) {
      if (keys["ArrowUp"] || keys["w"] || keys["W"]) { p.y -= p.spd; mv = true; }
      if (keys["ArrowDown"] || keys["s"] || keys["S"]) { p.y += p.spd; mv = true; }
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) { p.x -= p.spd; p.left = true; mv = true; }
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) { p.x += p.spd; p.left = false; mv = true; }
    }
    p.moving = mv;
    p.x = Math.max(0, Math.min(c.width - 48, p.x)); p.y = Math.max(0, Math.min(c.height - 48, p.y));

    if (p.biting && (p.bT += dt) >= 100) { p.bT -= 100; if (++p.bIdx >= 3) { p.bIdx = 0; p.biting = false; } }

    for (let en of enemies) {
      if (en.cd > 0) en.cd = Math.max(0, en.cd - dt);
      if (en.anim > 0) en.anim = Math.max(0, en.anim - dt);
      const dx = p.x - en.x, dy = p.y - en.y, d = Math.hypot(dx, dy);
      if (dx < -2) en.left = true; else if (dx > 2) en.left = false;

      if (d <= 45) {
        if (en.cd <= 0) {
          en.st = "ATK"; en.cd = 1200; en.anim = 300; p.hp -= 2;
          if (p.hp <= 0) { state = "TITLE"; enemies = []; break; }
        } else if (en.anim <= 0) en.st = "IDLE";
      } else if (d <= 360) {
        if (en.anim <= 0) en.st = "MOVE"; en.x += (dx / d) * en.spd; en.y += (dy / d) * en.spd;
      } else if (en.anim <= 0) en.st = "IDLE";

      drawSpr(en.st === "ATK" ? eAtk : (en.st === "MOVE" ? eMove : eIdle), en.x, en.y, en.left, "#d9534f");
    }

    if (state === "PLAY" && enemies.length === 0) { state = "SHOP"; pts += wave; }
    drawSpr(p.biting ? pBite[p.bIdx] : (p.moving ? pWalk : pIdle), p.x, p.y, p.left, "#333");

    ctx.fillStyle = "#222"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`HP: ${p.hp}/${p.max} | Wave: ${wave} | Pts: ${pts} | Bite: ${p.cd > 0 ? (p.cd/1000).toFixed(1)+"s" : "Ready"}`, 20, 30);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
