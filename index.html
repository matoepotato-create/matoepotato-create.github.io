<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bite Game</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border: 3px solid #e94560;
      background: #ffffff; /* White background so black line art shows clearly */
    }
  </style>
</head>
<body>

  <canvas id="game" width="600" height="400"></canvas>
  <p>Move: Arrow Keys or WASD | Bite: Spacebar</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // 1. Load your 4 animation frames
    const frameFiles = [
      "player.png",
      "player-bite-frame1.png",
      "player-bite-frame2.png",
      "player-bite-frame3.png"
    ];

    const frames = frameFiles.map(src => {
      const img = new Image();
      img.src = src;
      return img;
    });

    // 2. Player & Animation settings
    let player = {
      x: 260,
      y: 160,
      width: 80,
      height: 80,
      speed: 5
    };

    let currentFrame = 0;       // 0 = idle (player.png), 1-3 = bite frames
    let isBiting = false;
    let frameTimer = 0;
    const fps = 10;
    const frameInterval = 1000 / fps; // 100ms per frame (10 FPS)

    let keys = {};

    // 3. Keyboard controls
    window.addEventListener("keydown", e => {
      keys[e.key] = true;

      // Trigger bite animation on Spacebar (only if not already biting)
      if (e.code === "Space" && !isBiting) {
        e.preventDefault(); // Prevents page from scrolling
        isBiting = true;
        currentFrame = 1; // Jump immediately to player-bite-frame1.png
        frameTimer = 0;
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    // 4. Update movement and animation timing
    function update(deltaTime) {
      // Movement
      if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.y -= player.speed;
      if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.y += player.speed;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed;

      // Keep player inside the screen
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

      // 10 FPS Bite Animation logic
      if (isBiting) {
        frameTimer += deltaTime;
        if (frameTimer >= frameInterval) {
          frameTimer -= frameInterval;
          currentFrame++;

          // After frame 3, reset back to idle (player.png)
          if (currentFrame > 3) {
            currentFrame = 0;
            isBiting = false;
          }
        }
      }
    }

    // 5. Draw everything
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const activeImg = frames[currentFrame];
      if (activeImg.complete && activeImg.naturalWidth !== 0) {
        ctx.drawImage(activeImg, player.x, player.y, player.width, player.height);
      } else {
        // Fallback box if an image hasn't loaded yet
        ctx.fillStyle = "#333";
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }
    }

    // 6. Main game loop with accurate delta-time tracking
    let lastTime = 0;
    function loop(timestamp) {
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      update(deltaTime);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
