
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas LMS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth || 800;
      canvas.height = window.innerHeight || 600;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // 1. Load All Sprites & UI Button Art
    function loadImg(src) {
      const img = new Image();
      img.src = src;
      return img;
    }

    const idleImg = loadImg("player.png");
    const walkImg = loadImg("player-walk-frame1.png");
    const biteFrames = [
      loadImg("player-bite-frame1.png"),
      loadImg("player-bite-frame2.png"),
      loadImg("player-bite-frame3.png")
    ];

    const enemyIdleImg = loadImg("enemy-idle.png");
    const enemyMoveImg = loadImg("enemy-move.png");
    const enemyAttackImg = loadImg("enemy-attack.png");

    const playBtnImg = loadImg("play-button.png");
    const controlsBtnImg = loadImg("controls-button.png");

    // 2. Game State
    let gameState = "TITLE"; // TITLE, PLAYING, SHOP
    let showControls = false;
    let wave = 1;
    let points = 0;

    let player = {
      x: 0,
      y: 0,
      width: 48,
      height: 48,
      speed: 2.5,
      facingLeft: false,
      hp: 20,
      maxHp: 20,
      biteCooldown: 0
    };

    let isBiting = false;
    let biteIndex = 0;
    let biteTimer = 0;
    let isMoving = false;

    const fps = 10;
    const frameInterval = 1000 / fps;

    let enemies = [];
    let keys = {};

    // Button Hitboxes (Calculated dynamically on screen center)
    function getTitleButtons() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      return {
        play: { x: cx - 100, y: cy - 70, w: 200, h: 55 },
        controls: { x: cx - 100, y: cy + 5, w: 200, h: 55 }
      };
    }

    function getShopButtons() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      return {
        heal: { x: cx - 130, y: cy - 30, w: 260, h: 50 },
        maxHp: { x: cx - 130, y: cy + 35, w: 260, h: 50 },
        next: { x: cx - 130, y: cy + 110, w: 260, h: 55 }
      };
    }

    function isInside(mx, my, rect) {
      return mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h;
    }

    // 3. Left Mouse Button Click Handler (e.button === 0)
    canvas.addEventListener("mousedown", e => {
      if (e.button !== 0) return; // Strictly Left Mouse Button

      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (gameState === "TITLE") {
        const btns = getTitleButtons();
        if (isInside(mx, my, btns.play)) {
          startNewGame();
        } else if (isInside(mx, my, btns.controls)) {
          showControls = !showControls;
        }
      } else if (gameState === "SHOP") {
        const btns = getShopButtons();
        if (isInside(mx, my, btns.heal) && points >= 3 && player.hp < player.maxHp) {
          points -= 3;
          player.hp = Math.min(player.maxHp, player.hp + 5);
        } else if (isInside(mx, my, btns.maxHp) && points >= 5) {
          points -= 5;
          player.maxHp += 3;
          player.hp += 3;
        } else if (isInside(mx, my, btns.next)) {
          wave++;
          gameState = "PLAYING";
          spawnWave(wave);
        }
      }
    });

    // Change cursor to pointer when hovering over clickable buttons
    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let hovering = false;

      if (gameState === "TITLE") {
        const btns = getTitleButtons();
        hovering = isInside(mx, my, btns.play) || isInside(mx, my, btns.controls);
      } else if (gameState === "SHOP") {
        const btns = getShopButtons();
        hovering = isInside(mx, my, btns.heal) || isInside(mx, my, btns.maxHp) || isInside(mx, my, btns.next);
      }
      canvas.style.cursor = hovering ? "pointer" : "default";
    });

    function startNewGame() {
      wave = 1;
      points = 0;
      player.maxHp = 20;
      player.hp = 20;
      player.biteCooldown = 0;
      player.x = canvas.width / 2 - player.width / 2;
      player.y = canvas.height / 2 - player.height / 2;
      isBiting = false;
      showControls = false;
      canvas.style.cursor = "default";
      gameState = "PLAYING";
      spawnWave(wave);
    }

    function returnToTitle() {
      gameState = "TITLE";
      enemies = [];
    }

    function openShop() {
      gameState = "SHOP";
      points += wave; // Award points equal to wave number
    }

    // 4. Spawn Enemies (Wave * 5)
    function spawnWave(waveNum) {
      enemies = [];
      const count = waveNum * 5;
      const maxW = Math.max(100, canvas.width - 48);
      const maxH = Math.max(100, canvas.height - 48);

      for (let i = 0; i < count; i++) {
        let ex = Math.random() * maxW;
        let ey = Math.random() * maxH;
        let attempts = 0;

        while (Math.hypot(ex - player.x, ey - player.y) < 150 && attempts < 20) {
          ex = Math.random() * maxW;
          ey = Math.random() * maxH;
          attempts++;
        }

        enemies.push({
          x: ex,
          y: ey,
          width: 48,
          height: 48,
          speed: 1.3,
          hp: 2,
          state: "IDLE",
          facingLeft: false,
          attackCooldown: 0,
          attackAnimTimer: 0
        });
      }
    }

    // 5. Keyboard Controls & Bite Hit Detection
    window.addEventListener("keydown", e => {
      keys[e.key] = true;

      if (gameState === "PLAYING" && e.code === "Space" && !isBiting && player.biteCooldown <= 0) {
        e.preventDefault();
        isBiting = true;
        isMoving = false;
        biteIndex = 0;
        biteTimer = 0;
        player.biteCooldown = 1000;

        const biteRange = 65;
        const pCenterX = player.x + player.width / 2;
        const pCenterY = player.y + player.height / 2;

        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          const eCenterX = enemy.x + enemy.width / 2;
          const eCenterY = enemy.y + enemy.height / 2;
          const dist = Math.hypot(eCenterX - pCenterX, eCenterY - pCenterY);

          if (dist <= biteRange) {
            enemy.hp -= 1;
            const angle = Math.atan2(eCenterY - pCenterY, eCenterX - pCenterX);
            enemy.x += Math.cos(angle) * 20;
            enemy.y += Math.sin(angle) * 20;

            if (enemy.hp <= 0) {
              enemies.splice(i, 1);
            }
          }
        }
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    // 6. Update Loop
    function update(deltaTime) {
      if (gameState !== "PLAYING") return;

      if (player.biteCooldown > 0) {
        player.biteCooldown = Math.max(0, player.biteCooldown - deltaTime);
      }

      let moved = false;
      if (!isBiting) {
        if (keys["ArrowUp"] || keys["w"] || keys["W"]) {
          player.y -= player.speed;
          moved = true;
        }
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) {
          player.y += player.speed;
          moved = true;
        }
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
          player.x -= player.speed;
          player.facingLeft = true;
          moved = true;
        }
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
          player.x += player.speed;
          player.facingLeft = false;
          moved = true;
        }
      }
      isMoving = moved;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

      if (isBiting) {
        biteTimer += deltaTime;
        if (biteTimer >= frameInterval) {
          biteTimer -= frameInterval;
          biteIndex++;
          if (biteIndex >= biteFrames.length) {
            biteIndex = 0;
            isBiting = false;
          }
        }
      }

      const chaseRange = 360;
      const attackRange = 45;

      for (let enemy of enemies) {
        if (enemy.attackCooldown > 0) {
          enemy.attackCooldown = Math.max(0, enemy.attackCooldown - deltaTime);
        }
        if (enemy.attackAnimTimer > 0) {
          enemy.attackAnimTimer = Math.max(0, enemy.attackAnimTimer - deltaTime);
        }

        const dx = (player.x + player.width / 2) - (enemy.x + enemy.width / 2);
        const dy = (player.y + player.height / 2) - (enemy.y + enemy.height / 2);
        const dist = Math.hypot(dx, dy);

        enemy.facingLeft = dx < 0;

        if (dist <= attackRange) {
          if (enemy.attackCooldown <= 0) {
            enemy.state = "ATTACK";
            enemy.attackCooldown = 1200;
            enemy.attackAnimTimer = 300;
            player.hp -= 2;

            if (player.hp <= 0) {
              returnToTitle();
              return;
            }
          } else if (enemy.attackAnimTimer <= 0) {
            enemy.state = "IDLE";
          }
        } else if (dist <= chaseRange) {
          if (enemy.attackAnimTimer <= 0) enemy.state = "MOVE";
          enemy.x += (dx / dist) * enemy.speed;
          enemy.y += (dy / dist) * enemy.speed;
        } else {
          if (enemy.attackAnimTimer <= 0) enemy.state = "IDLE";
        }
      }

      if (enemies.length === 0) {
        openShop();
      }
    }

    // 7. Drawing Helpers
    function drawSprite(img, x, y, w, h, facingLeft, fallbackColor) {
Use code with caution.
ctx.save();
if (facingLeft) {
ctx.translate(x + w, y);
ctx.scale(-1, 1);
if (img.complete && img.naturalWidth !== 0) {
ctx.drawImage(img, 0, 0, w, h);
} else {
ctx.fillStyle = fallbackColor;
ctx.fillRect(0, 0, w, h);
}
} else {
if (img.complete && img.naturalWidth !== 0) {
ctx.drawImage(img, x, y, w, h);
} else {
ctx.fillStyle = fallbackColor;
ctx.fillRect(x, y, w, h);
}
}
ctx.restore();
}
function drawButton(rect, text, img, bgColor = "#222") {
if (img && img.complete && img.naturalWidth !== 0) {
ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h);
} else {
ctx.fillStyle = bgColor;
ctx.beginPath();
ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8);
ctx.fill();
ctx.fillStyle = "#ffffff";
ctx.font = "bold 20px system-ui, sans-serif";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText(text, rect.x + rect.w / 2, rect.y + rect.h / 2);
}
}
// 8. Main Render Loop
function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
if (gameState === "TITLE") {
const btns = getTitleButtons();
drawButton(btns.play, "Play", playBtnImg);
drawButton(btns.controls, "Controls", controlsBtnImg);
if (showControls) {
const cx = canvas.width / 2;
const cy = canvas.height / 2 + 85;
ctx.fillStyle = "#f4f4f4";
ctx.strokeStyle = "#222";
ctx.lineWidth = 2;
ctx.beginPath();
ctx.roundRect(cx - 180, cy, 360, 100, 10);
ctx.fill();
ctx.stroke();
ctx.fillStyle = "#222";
ctx.font = "16px system-ui, sans-serif";
ctx.textAlign = "center";
ctx.fillText("Move: WASD or Arrow Keys", cx, cy + 32);
ctx.fillText("Bite: Spacebar (1s cooldown)", cx, cy + 62);
}
return;
}
if (gameState === "SHOP") {
const cx = canvas.width / 2;
const cy = canvas.height / 2;
const btns = getShopButtons();
ctx.fillStyle = "#222";
ctx.font = "bold 28px system-ui, sans-serif";
ctx.textAlign = "center";
ctx.fillText(Wave ${wave} Complete! (+${wave} Points), cx, cy - 110);
ctx.font = "18px system-ui, sans-serif";
ctx.fillText(Health: ${player.hp} / ${player.maxHp}   |   Points: ${points}, cx, cy - 70);
const canHeal = points >= 3 && player.hp < player.maxHp;
const canMaxHp = points >= 5;
drawButton(btns.heal, "Heal +5 HP (3 Pts)", null, canHeal ? "#222" : "#aaa");
drawButton(btns.maxHp, "Max Health +3 HP (5 Pts)", null, canMaxHp ? "#222" : "#aaa");
drawButton(btns.next, "Start Next Wave", null, "#0969da");
return;
}
// Draw Enemies
for (let enemy of enemies) {
let eImg = enemyIdleImg;
if (enemy.state === "ATTACK") eImg = enemyAttackImg;
else if (enemy.state === "MOVE") eImg = enemyMoveImg;
drawSprite(eImg, enemy.x, enemy.y, enemy.width, enemy.height, enemy.facingLeft, "#d9534f");
}
// Draw Player
let pImg = idleImg;
if (isBiting) pImg = biteFrames[biteIndex];
else if (isMoving) pImg = walkImg;
drawSprite(pImg, player.x, player.y, player.width, player.height, player.facingLeft, "#333");
// Draw Top-Left HUD
ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
ctx.strokeStyle = "#222";
ctx.lineWidth = 2;
ctx.beginPath();
ctx.roundRect(16, 16, 460, 42, 8);
ctx.fill();
ctx.stroke();
ctx.fillStyle = "#222";
ctx.font = "bold 15px system-ui, sans-serif";
ctx.textAlign = "left";
ctx.textBaseline = "middle";
const biteText = player.biteCooldown > 0 ? Bite: ${(player.biteCooldown / 1000).toFixed(1)}s : "Bite: Ready";
ctx.fillText(HP: ${player.hp}/${player.maxHp}   |   Wave: ${wave} (${enemies.length} left)   |   Pts: ${points}   |   ${biteText}, 28, 37);
}
let lastTime = 0;
function loop(timestamp) {
const deltaTime = timestamp - lastTime;
lastTime = timestamp;
update(deltaTime);
draw();
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
