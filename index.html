<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas LMS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // 1. Load your 4 animation frames
    const frameFiles = [
      "player.png",
      "player-bite-frame1.png",
      "player-bite-frame2.png",
      "player-bite-frame3.png"
    ];

    const frames = frameFiles.map(src => {
      const img = new Image();
      img.src = src;
      return img;
    });

    // 2. Player & Animation settings (Slower speed: 2.5)
    let player = {
      x: canvas.width / 2 - 12,
      y: canvas.height / 2 - 12,
      width: 24,
      height: 24,
      speed: 2.5
    };

    let currentFrame = 0;
    let isBiting = false;
    let frameTimer = 0;
    const fps = 10;
    const frameInterval = 1000 / fps;

    let keys = {};

    // 3. Keyboard controls
    window.addEventListener("keydown", e => {
      keys[e.key] = true;

      if (e.code === "Space" && !isBiting) {
        e.preventDefault();
        isBiting = true;
        currentFrame = 1;
        frameTimer = 0;
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    // 4. Update movement and animation timing
    function update(deltaTime) {
      if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.y -= player.speed;
      if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.y += player.speed;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed;

      // Keep player inside the full screen edges
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

      // 10 FPS Bite Animation logic
      if (isBiting) {
        frameTimer += deltaTime;
        if (frameTimer >= frameInterval) {
          frameTimer -= frameInterval;
          currentFrame++;

          if (currentFrame > 3) {
            currentFrame = 0;
            isBiting = false;
          }
        }
      }
    }

    // 5. Draw everything
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const activeImg = frames[currentFrame];
      if (activeImg.complete && activeImg.naturalWidth !== 0) {
        ctx.drawImage(activeImg, player.x, player.y, player.width, player.height);
      } else {
        ctx.fillStyle = "#333";
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }
    }

    // 6. Main game loop
    let lastTime = 0;
    function loop(timestamp) {
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      update(deltaTime);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
